<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Open in Overleaf · ReOpSy</title>
<style>
  :root { color-scheme: light dark; --bg: #F5F6F2; --ink: #16202A; --muted: #56616B; --accent: #0E5D6C; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F1316; --ink: #E6E9E4; --muted: #9DA6AE; --accent: #7CC8D6; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; }
  main { max-width: 420px; text-align: center; }
  p { color: var(--muted); }
  button { min-height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent); color: var(--bg);
           font: 600 15px system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Open your survey in Overleaf</h1>
  <p id="msg" role="status">Getting the survey ready…</p>
  <noscript>JavaScript is required for this hand-off. You can download the LaTeX file from ReOpSy instead.</noscript>
  <form id="f" method="POST" action="https://www.overleaf.com/docs" accept-charset="UTF-8" rel="noreferrer" hidden>
    <input type="hidden" name="encoded_snip" id="snip">
    <input type="hidden" name="snip_name" value="main.tex">
    <input type="hidden" name="engine" value="pdflatex">
    <button id="send" type="submit" disabled>Send survey to Overleaf</button>
  </form>
</main>
<script>
  // The URL fragment stays in the browser. Never submit a user-provided
  // fragment on load; the reader explicitly sends it after seeing the notice.
  function prepareSurvey() {
    var form = document.getElementById('f');
    var send = document.getElementById('send');
    var snippet = document.getElementById('snip');
    form.hidden = true;
    send.disabled = true;
    snippet.value = '';
    var value = (location.hash || '').slice(1);
    history.replaceState(null, '', location.pathname);
    var msg = document.getElementById('msg');
    if (!/^[A-Za-z0-9_-]{1,32768}$/.test(value) || value.length % 4 === 1) {
      msg.textContent = 'No valid survey was found. Go back to ReOpSy and try again, or download the LaTeX file.';
      return;
    }
    try {
      var b64 = value.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var tex = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      snippet.value = encodeURIComponent(tex);
      msg.textContent = 'This sends your survey, including any notes and matrix entries, to Overleaf. Sign in there if asked.';
      send.disabled = false;
      form.hidden = false;
    } catch {
      msg.textContent = 'This survey could not be read. Go back to ReOpSy and download the LaTeX file instead.';
    }
  }
  window.addEventListener('hashchange', prepareSurvey);
  prepareSurvey();
</script>
</body>
</html>
