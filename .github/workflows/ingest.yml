name: Legacy ingest (manual)

# V1 pipeline: arXiv + OpenAlex -> Supabase. The V2 app reads its feed from
# Firestore (written by backend/pipeline/fetchAndSummarize.js behind the Render
# webhook), so this job no longer runs on a schedule. It is kept for reference
# and can still be started by hand from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      topics:
        description: 'Comma-separated topics, or "all"'
        required: false
        default: 'all'
      limit:
        description: 'Records per source per topic'
        required: false
        default: '40'
      dry:
        description: 'Dry run (no database writes)'
        type: boolean
        required: false
        default: false

# Two ingests writing at once would race on the upsert. One at a time.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # V2 added runtime dependencies (sqlite3, firebase-admin), and the webhook
      # tests load them, so install before testing.
      - name: Install
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Ingest
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: |
          node ingest/ingest.js \
            --topics "${{ github.event.inputs.topics || 'all' }}" \
            --limit "${{ github.event.inputs.limit || '40' }}" \
            --days 30 \
            ${{ github.event.inputs.dry == 'true' && '--dry' || '' }}
