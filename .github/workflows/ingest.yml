name: Nightly ingest

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ingest.yml'
  schedule:
    # 02:15 UTC = 07:45 IST. Off-peak for both OpenAlex and arXiv.
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      topics:
        description: 'Comma-separated topics, or "all"'
        required: false
        default: 'all'
      limit:
        description: 'Records per source per topic'
        required: false
        default: '40'
      dry:
        description: 'Dry run (no database writes)'
        type: boolean
        required: false
        default: false

# Two ingests writing at once would race on the upsert. One at a time.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ingest-pr-{0}', github.event.pull_request.number) || 'ingest' }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The ingest-only suite is dependency-free; the webhook suite is separate.
      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Ingest dry run (no database writes)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: backend
        run: |
          node ingest/ingest.js --topics ai-mental-health --limit 2 --days 30 --dry
          node ingest/ingest.js --topics management-organizations --source openalex --limit 2 --days 30 --dry

      - name: Ingest
        id: scheduled_ingest
        shell: bash
        if: github.event_name != 'pull_request'
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          INGEST_EVENT: ${{ github.event_name }}
          INGEST_TOPICS: ${{ inputs.topics || secrets.INGEST_TOPICS || 'all' }}
          INGEST_LIMIT: ${{ inputs.limit || secrets.INGEST_LIMIT || '40' }}
          INGEST_DRY: ${{ inputs.dry == true }}
          PUBLISH_FEED: ${{ vars.REOPSY_PUBLISH_FIRESTORE_FEED }}
          AI_SUMMARY_REQUEST_LIMIT: ${{ vars.AI_SUMMARY_REQUEST_LIMIT }}
          GEMINI_SUMMARY_MODEL: ${{ vars.GEMINI_SUMMARY_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_SUMMARY_MODEL: ${{ vars.XAI_SUMMARY_MODEL }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ALLOW_XAI_SUMMARY: ${{ vars.ALLOW_XAI_SUMMARY }}
        run: |
          args=(--topics "$INGEST_TOPICS" --limit "$INGEST_LIMIT" --days 30)
          snapshot="$RUNNER_TEMP/reopsy-feed.json"
          publish=false
          if [[ "$INGEST_DRY" == "true" ]]; then
            args+=(--dry)
            echo "Dry run: no Firestore feed will be published."
          elif [[ "$PUBLISH_FEED" == "true" ]]; then
            if [[ "$INGEST_TOPICS" == "all" ]]; then
              publish=true
              args+=(--feed-out "$snapshot")
            elif [[ "$INGEST_EVENT" == "schedule" ]]; then
              echo "::error::Firestore publishing requires a full scheduled run. Set INGEST_TOPICS to all or remove the legacy topic-list secret."
              exit 1
            else
              echo "Scoped manual run: Firestore publication skipped."
            fi
          else
            echo "Firestore publishing is disabled."
          fi
          node ingest/ingest.js "${args[@]}"
          if [[ "$publish" == "true" && ! -s "$snapshot" ]]; then
            echo "::error::The full ingest did not produce the required feed snapshot."
            exit 1
          fi
          echo "publish_snapshot=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.scheduled_ingest.outputs.publish_snapshot == 'true'
        with:
          node-version: '24'

      - name: Publish validated Firestore feed
        if: steps.scheduled_ingest.outputs.publish_snapshot == 'true'
        working-directory: backend
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          REOPSY_FIRESTORE_PROJECT_ID: ${{ vars.REOPSY_FIRESTORE_PROJECT_ID }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/publish-feed.cjs "$RUNNER_TEMP/reopsy-feed.json"

  # A silent failure is the failure mode that actually bites: the job stops
  # working, the data goes stale, and nobody notices for a month. This opens an
  # issue so the repo owner gets an email.
  notify:
    needs: ingest
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly ingest failed — ${new Date().toISOString().slice(0, 10)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ingest-failure',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Failed again: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['ingest-failure'],
              body: [
                'The scheduled ingest job failed.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Usual causes, in order of likelihood:',
                '- an expired or rotated `SUPABASE_SERVICE_KEY`',
                '- OpenAlex or arXiv rate limiting (429) — usually resolves itself',
                '- a schema change that broke the upsert',
                '',
                'The app keeps serving whatever is already in the database, and falls',
                'back to its built-in demo set if that is empty, so this is not urgent.',
              ].join('\n'),
            });
